<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Game NPC Engine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: World State & Gossip -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h2><span class="icon">🌍</span> World Controller</h2>
            </div>
            
            <div class="control-group">
                <h3>Live World State</h3>
                <form id="world-form">
                    <div class="input-group">
                        <label>Time of Day</label>
                        <select id="world-time">
                            <option value="">-- No override --</option>
                            <option value="Dawn">Dawn</option>
                            <option value="Midday">Midday</option>
                            <option value="Dusk">Dusk</option>
                            <option value="Midnight">Midnight</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Weather</label>
                        <select id="world-weather">
                            <option value="">-- No override --</option>
                            <option value="Clear skies">Clear skies</option>
                            <option value="Raining heavily">Raining heavily</option>
                            <option value="Thundering">Thundering</option>
                            <option value="Snowing">Snowing</option>
                            <option value="Foggy">Foggy</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Current Region</label>
                        <input type="text" id="world-region" placeholder="e.g. Arkham Village">
                    </div>
                    <div class="input-group">
                        <label>Nearby Events (comma separated)</label>
                        <input type="text" id="world-events" placeholder="e.g. Dragon attack, Festival">
                    </div>
                    <button type="submit" class="btn primary-btn">Update World</button>
                </form>
            </div>

            <div class="control-group">
                <h3>🗣️ Inject Gossip / Rumor</h3>
                <form id="gossip-form">
                    <div class="input-group">
                        <label>Event Description</label>
                        <input type="text" id="gossip-event" required placeholder="e.g. The player stole a sword">
                    </div>
                    <div class="input-group">
                        <label>Source NPC</label>
                        <input type="text" id="gossip-source" required placeholder="e.g. Guard Captain">
                    </div>
                    <div class="input-group">
                        <label>Sentiment</label>
                        <select id="gossip-sentiment">
                            <option value="negative">Negative</option>
                            <option value="positive">Positive</option>
                            <option value="neutral">Neutral</option>
                        </select>
                    </div>
                    <button type="submit" class="btn warning-btn">Spread Rumor</button>
                </form>
                <div id="gossip-status" class="status-msg"></div>
            </div>
        </aside>

        <!-- Main Area: Chat & Setup -->
        <main class="main-content">
            <header class="top-bar glass-panel">
                <h1>Ultimate Game NPC Engine</h1>
                <div class="server-status" id="server-status">
                    <span class="status-dot"></span> Checking server...
                </div>
            </header>

            <div class="chat-container glass-panel">
                <div class="npc-setup">
                    <div class="input-row">
                        <div class="input-group">
                            <label>Character Name</label>
                            <input type="text" id="char-name" value="Grom">
                        </div>
                        <div class="input-group">
                            <label>Session ID (Player)</label>
                            <input type="text" id="session-id" value="player_001">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Character Persona</label>
                        <textarea id="char-persona" rows="2">An angry Orc blacksmith who hates humans and loves gold.</textarea>
                    </div>
                    <div class="setup-actions">
                        <button id="btn-clear-mem" class="btn outline-btn">Clear Memory</button>
                    </div>
                </div>

                <div class="chat-history" id="chat-history">
                    <div class="message system-msg">
                        Configure your NPC above and start chatting to test the LLM.
                    </div>
                </div>

                <form id="chat-form" class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type your message..." required autocomplete="off">
                    <button type="submit" class="btn send-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Hidden audio element for TTS -->
    <audio id="audio-player"></audio>
    
    <script src="script.js"></script>
</body>
</html>
